[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flightlink-desktop"
version = "1.0.0"
description = "FlightLink Desktop 1.0 Windows client (PySide6 + Qt Quick/QML)"
requires-python = ">=3.11,<3.14"
dependencies = [
    "PySide6-Essentials==6.12.0",
    "httpx==0.29.0",
    "keyring==25.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-qt==4.5.0",
    "pytest-cov==7.1.0",
    "freezegun==1.5.5",
    "pyyaml==6.0.4",
]

[project.gui-scripts]
flightlink-desktop = "flightlink_desktop.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
flightlink_desktop = ["qml/**/*.qml", "qml/**/qmldir"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
qt_api = "pyside6"
